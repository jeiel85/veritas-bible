name: Flutter Multi-Platform Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Version Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract GitHub tag version
        id: version_check
        run: |
          # Git tag에서 'v' 접두사 제거 (v1.5.0+7 → 1.5.0+7)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          
          # pubspec.yaml에서 전체 버전 읽기 (1.5.0+7)
          PUBSPEC_VERSION=$(grep -E "^version:" pubspec.yaml | sed 's/version: //' | tr -d ' ')
          
          # TAG와 pubspec.yaml의 버전을 직접 비교 (전체 문자열 비교)
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "❌ ERROR: Version mismatch! Tag: $TAG_VERSION, App: $PUBSPEC_VERSION"
            exit 1
          fi
          echo "✅ Version check passed! Tag: $TAG_VERSION = App: $PUBSPEC_VERSION"

  preflight:
    name: Preflight Analyze & Smoke Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - run: flutter pub get
      - name: Static analysis (non-fatal warnings/infos)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Smoke test (app startup)
        run: flutter test test/widget_test.dart

  build-android:
    name: Build Android APK
    needs: [validate, preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/veritas-release.keystore
      - run: flutter pub get
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows EXE
    needs: [validate, preflight]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Archive Windows Build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath veritas-bible-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: veritas-bible-windows.zip

  build-ios:
    name: Build iOS
    needs: [validate, preflight]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign # 인증서 없이 빌드만 수행
      - name: Archive iOS Build
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../veritas-bible-ios.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: veritas-bible-ios.ipa

  release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/app-release.apk
            artifacts/windows-zip/veritas-bible-windows.zip
            artifacts/ios-ipa/veritas-bible-ios.ipa
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
